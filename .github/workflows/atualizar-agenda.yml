name: Atualizar agenda

on:
  schedule:
    # Uma vez por dia, 06:17 em Brasília (09:17 UTC), antes dos jogos do dia.
    # "Hoje", "próximo jogo" e "ao vivo" são calculados no navegador, então a
    # página continua certa entre uma execução e outra.
    - cron: "17 9 * * *"
  # Botão "Run workflow": roda o pipeline completo na hora.
  workflow_dispatch:
  # Push de código só republica o site, sem chamar nenhuma API.
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-agenda
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Pipeline (guia + API)
        if: github.event_name != 'push'
        # Se as fontes falharem, o site é publicado com os últimos dados bons.
        continue-on-error: true
        run: npm run dados
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Versionar dados
        if: github.event_name != 'push'
        run: |
          git config user.name "agenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças na agenda."
          else
            git commit -m "dados: agenda de $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Montar site
        run: |
          mkdir _site
          cp -r index.html assets data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
